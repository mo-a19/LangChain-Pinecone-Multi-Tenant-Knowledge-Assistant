<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Knowledge Hub — RAG knowledge base API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#2a2622"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#c9822b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9822b"/>
      <stop offset="1" stop-color="#1f7a5a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80 120)" stroke="#f5f2ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 40V8a8 8 0 0 1 8-8h32v48H12a8 8 0 0 0-8 8"/>
      <path d="M4 56a8 8 0 0 1 8-8h32v16H12a8 8 0 0 1-8-8z"/>
    </g>
    <text x="150" y="168" fill="#f5f2ec" font-size="56" font-weight="700" letter-spacing="-1.5">Knowledge Hub</text>
    <text x="82" y="226" fill="#bdb6aa" font-size="21">Upload PDFs, images, Q&amp;A and FAQs, then chat with them.</text>
    <text x="82" y="262" fill="#bdb6aa" font-size="21">Multi-tenant RAG API with source-backed answers.</text>
    <g font-size="16" font-weight="600">
      <rect x="82" y="300" rx="14" width="96" height="30" fill="#ffffff" fill-opacity="0.08"/>
      <text x="130" y="320" fill="#f5f2ec" text-anchor="middle">FastAPI</text>
      <rect x="188" y="300" rx="14" width="110" height="30" fill="#ffffff" fill-opacity="0.08"/>
      <text x="243" y="320" fill="#f5f2ec" text-anchor="middle">LangChain</text>
      <rect x="308" y="300" rx="14" width="100" height="30" fill="#ffffff" fill-opacity="0.08"/>
      <text x="358" y="320" fill="#f5f2ec" text-anchor="middle">Pinecone</text>
      <rect x="418" y="300" rx="14" width="96" height="30" fill="#ffffff" fill-opacity="0.08"/>
      <text x="466" y="320" fill="#f5f2ec" text-anchor="middle">OpenAI</text>
      <rect x="524" y="300" rx="14" width="104" height="30" fill="#ffffff" fill-opacity="0.08"/>
      <text x="576" y="320" fill="#f5f2ec" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Pipeline illustration -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <!-- sources -->
    <g fill="#f5f2ec" fill-opacity="0.06" stroke="#f5f2ec" stroke-opacity="0.25">
      <rect x="760" y="70" width="120" height="44" rx="10"/>
      <rect x="760" y="130" width="120" height="44" rx="10"/>
      <rect x="760" y="190" width="120" height="44" rx="10"/>
      <rect x="760" y="250" width="120" height="44" rx="10"/>
    </g>
    <g fill="#f5f2ec" text-anchor="middle">
      <text x="820" y="97">PDF</text>
      <text x="820" y="157">Images</text>
      <text x="820" y="217">Q&amp;A</text>
      <text x="820" y="277">FAQ</text>
    </g>
    <!-- connectors -->
    <g fill="none" stroke="url(#line)" stroke-width="2">
      <path d="M880 92 C930 92 930 182 970 182"/>
      <path d="M880 152 C930 152 930 182 970 182"/>
      <path d="M880 212 C930 212 930 182 970 182"/>
      <path d="M880 272 C930 272 930 182 970 182"/>
      <path d="M1090 182 H1130"/>
    </g>
    <!-- vector store -->
    <g transform="translate(970 132)">
      <rect width="120" height="100" rx="14" fill="#c9822b" fill-opacity="0.16" stroke="#c9822b"/>
      <g fill="#c9822b">
        <circle cx="30" cy="30" r="5"/><circle cx="58" cy="22" r="5"/><circle cx="88" cy="34" r="5"/>
        <circle cx="40" cy="56" r="5"/><circle cx="72" cy="52" r="5"/><circle cx="96" cy="64" r="5"/>
      </g>
      <text x="60" y="88" fill="#f5f2ec" text-anchor="middle">Vectors</text>
    </g>
    <!-- chat bubble -->
    <g transform="translate(1130 142)">
      <path d="M0 12a12 12 0 0 1 12-12h76a12 12 0 0 1 12 12v44a12 12 0 0 1-12 12H30l-16 14v-14h-2A12 12 0 0 1 0 56z" fill="#1f7a5a" fill-opacity="0.22" stroke="#1f7a5a"/>
      <text x="50" y="40" fill="#f5f2ec" text-anchor="middle">Answer</text>
    </g>
  </g>
</svg>
